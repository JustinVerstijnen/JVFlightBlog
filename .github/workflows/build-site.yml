name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.workflow }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: "0.164.0"
  NODE_VERSION: "24"
  HUGO_ENVIRONMENT: production
  HUGO_ENV: production
  HUGO_CACHEDIR: /tmp/hugo_cache
  DART_SASS_VERSION: "1.103.1"

jobs:
  build:
    name: Build Hugo site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Node.js for PostCSS
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Install standalone Dart Sass
        run: |
          set -euo pipefail

          curl -L \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" \
            -o /tmp/dart-sass.tar.gz

          tar -xzf /tmp/dart-sass.tar.gz -C /tmp

          sudo rm -rf /opt/dart-sass
          sudo mv /tmp/dart-sass /opt/dart-sass

          echo "/opt/dart-sass" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          echo "Hugo:"
          hugo version

          echo
          echo "Node:"
          node --version

          echo
          echo "npm:"
          npm --version

          echo
          echo "Go:"
          go version

          echo
          echo "Dart Sass:"
          sass --version

          echo
          echo "Dart Sass path:"
          which sass

          echo
          echo "Embedded protocol test:"
          sass --embedded --version

      - name: Show Hugo module graph
        run: |
          hugo mod graph

      - name: Generate Docsy npm package
        run: |
          set -euo pipefail

          hugo mod npm pack

          if [ ! -f packages/hugoautogen/package.json ]; then
            echo "ERROR: packages/hugoautogen/package.json was not generated"
            exit 1
          fi

          npm pkg set \
            'name="@jvflightblog/hugoautogen"' \
            private=true \
            --json \
            --prefix packages/hugoautogen

          echo "Generated Hugo npm package:"
          cat packages/hugoautogen/package.json

      - name: Install Node dependencies
        run: |
          set -euo pipefail

          # package.json contains packages/hugoautogen as a workspace.
          # hugo mod npm pack generates that workspace during the build.
          # npm install is therefore deliberately used instead of npm ci.
          npm install --ignore-scripts

      - name: Verify Docsy module
        run: |
          echo "Hugo modules:"
          hugo mod graph

          echo
          echo "Docsy module:"
          hugo mod graph | grep "github.com/google/docsy/theme@v0.17.0" || {
            echo "ERROR: Docsy 0.17.0 module not found"
            exit 1
          }

      - name: Verify Dart Sass
        run: |
          if ! command -v sass >/dev/null 2>&1; then
            echo "ERROR: Dart Sass is not available in PATH"
            exit 1
          fi

          echo "Dart Sass executable:"
          which sass

          echo
          echo "Dart Sass version:"
          sass --version

          echo
          echo "Testing embedded protocol:"
          sass --embedded --version

      - name: Clean previous Hugo output
        run: |
          rm -rf public

      - name: Build site
        timeout-minutes: 10
        run: |
          echo "Starting Hugo production build..."

          hugo \
            --minify \
            --cleanDestinationDir \
            --gc \
            --logLevel info \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Sanity check build output
        run: |
          echo "Checking public directory..."

          test -d public
          test -f public/index.html

          echo
          echo "Checking for symlinks..."

          if find public -type l | grep -q .; then
            echo "ERROR: symlinks found in public directory"
            find public -type l
            exit 1
          fi

          echo
          echo "Checking artifact size..."
          du -sh public

          echo
          echo "First files in public:"
          find public -maxdepth 2 -type f | awk 'NR <= 50 { print }'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
